name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The prebuilt OpenCASCADE from conda-forge, which scratchcad-occt-sys
      # links by default.
      - uses: ./.github/actions/install-occt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  # The crates' C++ headers, with the clang-format version their style was set with.
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jidicula/clang-format-action@v4.18.0
        with:
          clang-format-version: "14"
          check-path: crates/scratchcad-occt-sys/include

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/install-occt
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --locked -p scratchcad --fail-under-lines 90 --summary-only
      - run: >
          cargo llvm-cov --locked -p scratchcad-occt-rhai -p scratchcad-occt-sys
          --fail-under-lines 95 --summary-only --show-missing-lines

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    env:
      # The integration tests run the MCP server against this real binary.
      SCRATCHCAD_BIN: ${{ github.workspace }}/target/release/scratchcad
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The binary links OpenCASCADE dynamically, so the integration tests
      # need LD_LIBRARY_PATH, which this also sets.
      - uses: ./.github/actions/install-occt
      - run: cargo build --release --locked -p scratchcad
        working-directory: .
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build

  dev-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v4
      # Builds the compose services with layers cached in the GitHub Actions
      # cache, so only layers whose inputs changed are rebuilt. mode=max also
      # keeps the dependency-only layers, so a source change reuses them.
      - uses: docker/bake-action@v7
        with:
          source: .
          files: compose.yaml
          set: |
            server.cache-from=type=gha,scope=dev-server
            server.cache-to=type=gha,scope=dev-server,mode=max
            mcp.cache-from=type=gha,scope=dev-mcp
            mcp.cache-to=type=gha,scope=dev-mcp,mode=max
